<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modellgitter in AR</title>
<meta name="description" content="">
<!-- Structure only. Design: theme/ · texts: content/texts.de.js · layout: css/ · behaviour: js/ -->
<script src="js/view.js" data-app="modellgitter"></script>
<link rel="stylesheet" href="theme/theme.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <span class="logo" data-brand="logo"></span>
  <div class="top-right">
    <button type="button" class="view-toggle"></button>
  </div>
</header>

<div class="poster small">
  <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
  <svg class="l2" viewBox="0 0 400 400" aria-hidden="true"><path fill="currentColor" d="M20,300 A180,180 0 0 1 380,300 L310,300 A110,110 0 0 0 90,300 Z"/></svg>
  <svg class="l3" viewBox="0 0 400 400" aria-hidden="true">
    <circle cx="200" cy="200" r="180"/>
    <ellipse cx="200" cy="200" rx="95" ry="180"/>
    <line x1="200" y1="20" x2="200" y2="380"/>
    <line x1="20" y1="200" x2="380" y2="200"/>
    <line x1="44" y1="110" x2="356" y2="110"/>
    <line x1="44" y1="290" x2="356" y2="290"/>
  </svg>
  <div class="poster-text">
    <h1 class="headline" data-t-html="poster.headline"></h1>
    <p class="lead" data-t="poster.lead"></p>
  </div>
</div>

<!-- Nine grids: scrollable strip of chips (style guide 6.4) -->
<nav class="strip" id="strip" data-t-aria="stripAria">
  <button type="button" data-grid="icon"><span class="gi" aria-hidden="true"><svg viewBox="0 0 200 200"><path fill="currentColor" d="M100,10 L190,180 L10,180 Z"/></svg></span><span data-t="grids.icon.short"></span></button>
  <button type="button" data-grid="cubedsphere"><span class="gi" aria-hidden="true"><svg viewBox="0 0 200 200"><rect x="45" y="45" width="110" height="110" fill="currentColor"/></svg></span><span data-t="grids.cubedsphere.short"></span></button>
  <button type="button" data-grid="gaussian"><span class="gi" aria-hidden="true"><svg viewBox="0 0 200 200"><rect x="65" y="30" width="70" height="36" fill="currentColor"/><rect x="35" y="82" width="130" height="36" fill="currentColor"/><rect x="65" y="134" width="70" height="36" fill="currentColor"/></svg></span><span data-t="grids.gaussian.short"></span></button>
  <button type="button" data-grid="latlon"><span class="gi" aria-hidden="true"><svg viewBox="0 0 200 200"><rect x="40" y="30" width="120" height="36" fill="currentColor"/><rect x="40" y="82" width="120" height="36" fill="currentColor"/><rect x="40" y="134" width="120" height="36" fill="currentColor"/></svg></span><span data-t="grids.latlon.short"></span></button>
  <button type="button" data-grid="voronoi"><span class="gi" aria-hidden="true"><svg viewBox="0 0 200 200"><circle cx="70" cy="130" r="45" fill="currentColor"/><circle cx="145" cy="65" r="27" fill="currentColor"/><circle cx="155" cy="150" r="15" fill="currentColor"/></svg></span><span data-t="grids.voronoi.short"></span></button>
  <button type="button" data-grid="hexicosahedral"><span class="gi" aria-hidden="true"><svg viewBox="0 0 200 200"><polygon points="100,20 170,60 170,140 100,180 30,140 30,60" fill="currentColor"/></svg></span><span data-t="grids.hexicosahedral.short"></span></button>
  <button type="button" data-grid="reducedgaussian"><span class="gi" aria-hidden="true"><svg viewBox="0 0 200 200"><rect x="80" y="24" width="40" height="30" fill="currentColor"/><rect x="45" y="60" width="110" height="30" fill="currentColor"/><rect x="45" y="110" width="110" height="30" fill="currentColor"/><rect x="80" y="146" width="40" height="30" fill="currentColor"/></svg></span><span data-t="grids.reducedgaussian.short"></span></button>
  <button type="button" data-grid="stretched"><span class="gi" aria-hidden="true"><svg viewBox="0 0 200 200"><rect x="35" y="35" width="130" height="130" fill="currentColor" opacity="0.35" transform="rotate(15 100 100)"/><rect x="70" y="70" width="60" height="60" fill="currentColor" transform="rotate(15 100 100)"/></svg></span><span data-t="grids.stretched.short"></span></button>
  <button type="button" data-grid="yinyang"><span class="gi" aria-hidden="true"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="4"/><path fill="currentColor" d="M100,20 A80,80 0 0,1 100,180 A40,40 0 0,1 100,100 A40,40 0 0,0 100,20 Z"/><circle cx="100" cy="60" r="10" style="fill:var(--paper)"/><circle cx="100" cy="140" r="10" fill="currentColor"/></svg></span><span data-t="grids.yinyang.short"></span></button>
</nav>

<main class="page">
  <div class="lab">
    <div class="lab-pre">
      <div class="section-label" id="grid-count"></div>
      <h2 class="h2-short grid-name" id="grid-name"></h2>
    </div>

    <div class="lab-stage">
      <div class="stage-frame square fit" id="stage">
        <model-viewer
          id="viewer"
          ar
          ar-modes="webxr scene-viewer quick-look"
          ar-scale="auto"
          ar-placement="floor"
          camera-controls
          bounds="tight"
          touch-action="pan-y"
          interaction-prompt="none"
          shadow-intensity="1"
          shadow-softness="0.9"
          exposure="1.05"
          environment-image="neutral"
          camera-orbit="35deg 75deg auto">
          <!-- the AR button sits below the stage (#ar-launch); this empty slot hides model-viewer's own -->
          <span slot="ar-button" hidden></span>
        </model-viewer>
      </div>
      <p class="ar-note" id="model-error" hidden></p>
    </div>

    <div class="lab-post">
      <p class="hint" data-t="hint"></p>

      <div class="ar-row" id="ar-row">
        <button type="button" class="btn big primary" id="ar-launch" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2v6m0 8v6M4.9 4.9l4.2 4.2m5.8 5.8l4.2 4.2M2 12h6m8 0h6M4.9 19.1l4.2-4.2m5.8-5.8l4.2-4.2"/></svg>
          <span><span id="ar-label"></span><span class="sub" data-t="ar.sub"></span></span>
        </button>
        <button type="button" class="info" aria-controls="ar-help" data-t-aria="ar.infoAria"></button>
      </div>
      <div class="info-note" id="ar-help" hidden data-t-html="ar.note"></div>
      <p class="ar-note" id="ar-desk" hidden data-t="ar.desk"></p>
      <p class="ar-note" id="ar-failed" hidden data-t="ar.failed"></p>

      <div class="facts-head">
        <span class="section-label" data-t="facts.title"></span>
        <button type="button" class="info" aria-controls="facts-help" data-t-aria="facts.infoAria"></button>
      </div>
      <div class="info-note" id="facts-help" hidden data-t-html="facts.note"></div>
      <dl class="facts" aria-live="polite">
        <div><dt data-t="facts.institution"></dt><dd id="f-institution"></dd></div>
        <div><dt data-t="facts.type"></dt><dd id="f-type"></dd></div>
        <div><dt data-t="facts.cells"></dt><dd id="f-cells"></dd></div>
        <div><dt data-t="facts.resolution"></dt><dd id="f-resolution"></dd></div>
      </dl>
      <p class="text explain" id="f-explain"></p>

      <div class="tasks" id="mg-tasks">
        <h3 data-t="tasks.title"></h3>
        <ul>
          <li data-task="turn"><span class="box"></span><span data-t="tasks.turn"></span></li>
          <li data-task="zoom"><span class="box"></span><span data-t="tasks.zoom"></span></li>
          <li data-task="three"><span class="box"></span><span data-t="tasks.three"></span></li>
        </ul>
        <div class="status" id="task-status"></div>
      </div>
      <div class="merke locked" data-for="mg-tasks">
        <h3 data-t="merke.title"></h3>
        <p data-t="merke.text"></p>
        <span class="locked-note"></span>
      </div>
    </div>
  </div>

  <div class="topics">
    <details class="topic"><summary data-t="topics.what.title"></summary><div class="topic-body" data-t-html="topics.what.body"></div></details>
    <details class="topic">
      <summary data-t="topics.why.title"></summary>
      <div class="topic-body">
        <div data-t-html="topics.why.body"></div>
        <figure class="figure">
          <svg viewBox="0 0 400 220" role="img" data-t-aria="topics.why.figAria">
            <line x1="200" y1="14" x2="200" y2="206" stroke="currentColor" stroke-width="2"/>
            <circle cx="100" cy="110" r="88" fill="none" stroke="currentColor" stroke-width="3"/>
            <g style="stroke:var(--fig-tri)" stroke-width="3" fill="none" stroke-linecap="round">
              <line x1="100" y1="110" x2="188" y2="110"/>
              <line x1="100" y1="110" x2="144" y2="186"/>
              <line x1="100" y1="110" x2="56" y2="186"/>
              <line x1="100" y1="110" x2="12" y2="110"/>
              <line x1="100" y1="110" x2="56" y2="34"/>
              <line x1="100" y1="110" x2="144" y2="34"/>
              <path d="M188,110 L144,186 L56,186 L12,110 L56,34 L144,34 Z"/>
            </g>
            <circle cx="300" cy="110" r="88" fill="none" stroke="currentColor" stroke-width="3"/>
            <g style="fill:var(--fig-quad)">
              <rect x="286" y="46" width="28" height="28" transform="rotate(45 300 60)"/>
              <rect x="248" y="84" width="28" height="28" transform="rotate(45 262 98)"/>
              <rect x="324" y="84" width="28" height="28" transform="rotate(45 338 98)"/>
              <rect x="286" y="122" width="28" height="28" transform="rotate(45 300 136)"/>
              <rect x="248" y="146" width="26" height="26" transform="rotate(45 261 159)"/>
              <rect x="324" y="146" width="26" height="26" transform="rotate(45 337 159)"/>
            </g>
          </svg>
          <figcaption data-t="topics.why.figCaption"></figcaption>
        </figure>
      </div>
    </details>
    <details class="topic"><summary data-t="topics.simplified.title"></summary><div class="topic-body" data-t-html="topics.simplified.body"></div></details>
  </div>

  <nav class="pager" data-t-aria="pager.aria">
    <button type="button" class="btn prev" id="pager-prev"><span aria-hidden="true">←</span><span class="t" id="pager-prev-name"></span></button>
    <span class="home pager-count" id="pager-count"></span>
    <button type="button" class="btn next" id="pager-next"><span class="t" id="pager-next-name"></span><span aria-hidden="true">→</span></button>
  </nav>
</main>

<footer class="foot">
  <p class="sources" data-t="sources"></p>
  <p class="brand-line" data-brand="line"></p>
</footer>

<script src="theme/theme.js"></script>
<script src="content/texts.de.js"></script>
<script src="js/texts.js"></script>
<script src="js/brand.js"></script>
<script src="js/kit.js"></script>
<script src="js/vendor/model-viewer-umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
